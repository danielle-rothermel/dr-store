[project]
name = "dr-store"
version = "0.2.4"
description = "Storage primitives for content-addressed records, document artifacts, and keyed coordination."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "content-addressed",
    "object-store",
    "append-only",
    "immutable",
    "lease",
    "coordination",
    "storage",
    "hashing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "dr-serialize>=0.1.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "sqlalchemy[asyncio]>=2.0",
]

[project.urls]
Repository = "https://github.com/danielle-rothermel/dr-store"
Issues = "https://github.com/danielle-rothermel/dr-store/issues"
Documentation = "https://danielle-rothermel.github.io/dr-store/"
Changelog = "https://github.com/danielle-rothermel/dr-store/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415", "DTZ001", "SIM117", "S608"]
"src/dr_store/lease/**/*.py" = [
    "S608",
    "TRY301",
    "TRY300",
    "TRY004",
    "PLC0415",
    "SIM117",
    "ISC004",
    "BLE001",
    "PLR0911",
    "PLR2004",
]
"src/dr_store/relational/**/*.py" = ["S608", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ty.src]
include = ["src", "tests"]
