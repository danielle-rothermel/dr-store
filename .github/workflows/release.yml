name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dr-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify tag matches pyproject version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Pushed tag '${GITHUB_REF_NAME}' does not match pyproject version (expected '${expected}')" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
          enable-cache: false
      - run: scripts/pre-check.sh
      - run: uv build
      # Publishes via PyPI Trusted Publishing (OIDC) — no API token.
      # Requires this repo and workflow to be registered as a PyPI publisher.
      - uses: pypa/gh-action-pypi-publish@release/v1
