name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: scripts/pre-check.sh

  postgres:
    runs-on: depot-ubuntu-24.04
    strategy:
      matrix:
        postgres-version: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: dr_store_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
          POSTGRES_PASSWORD: dr-store-disposable-ci-password
          POSTGRES_USER: dr_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dr_store_test -d dr_store_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DR_STORE_POSTGRES_DSN: postgresql://dr_store_test@127.0.0.1:5432/dr_store_test
      DR_STORE_REQUIRE_POSTGRES: "1"
      PGPASSWORD: dr-store-disposable-ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: >-
          uv run pytest -q
          tests/storage_backends/test_postgresql_install.py
          tests/storage_backends/test_postgresql_backend.py
          tests/storage_backends/test_postgresql_contract.py
