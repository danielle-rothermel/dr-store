name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - name: Verify built wheel
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          wheel_env="$(mktemp -d)"
          uv build --wheel --out-dir "$artifact_dir"
          uv export --locked --no-dev --no-emit-project \
            --output-file "$artifact_dir/requirements.txt"
          uv venv --python "${{ matrix.python-version }}" "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" \
            --requirement "$artifact_dir/requirements.txt"
          uv pip install --python "$wheel_env/bin/python" --no-deps \
            "$artifact_dir"/*.whl
          (
            cd "$wheel_env"
            "$wheel_env/bin/python" -I - "$GITHUB_WORKSPACE" \
              < "$GITHUB_WORKSPACE/tests/verify_built_wheel.py"
          )
