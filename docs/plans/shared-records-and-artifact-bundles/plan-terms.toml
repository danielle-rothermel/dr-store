# Proposed additions to .defs/terms.toml for plan review. These terms do not
# become repository vocabulary until the corresponding implementation lands.
#:schema ../../../.defs/terms.schema.json

[[terms]]
name = "PostgreSQL backend"
definition = """
A persistent shared backend that stores object and binding tables in a \
caller-selected PostgreSQL database through one concrete caller-owned \
asynchronous pool. Independently running clients observe the same asynchronous \
backend semantics without PostgreSQL-specific behavior entering the object store \
or record cache surfaces."""
exported_symbols = ["PostgresBackend", "install_postgres"]
categories = ["object storage"]
is_a = ["backend"]

[[terms]]
name = "artifact bundle"
definition = """
A terminal completed publication composed of one bundle manifest and exactly \
the zero or more bundle artifacts described by it. The supported bundle API \
exposes no mutation after completion; a directory left before final manifest \
publication is an incomplete publication, not an artifact bundle. Its directory \
format is intended for one task, run, or result publication rather than a \
high-volume event record."""
exported_symbols = ["ArtifactBundleError", "BundleAllocationError"]
categories = ["document artifacts"]

[[terms]]
name = "bundle artifact"
definition = """
One complete raw-byte regular file included as a direct child of an artifact \
bundle and identified by a safe relative name. Its domain meaning belongs to \
the caller's manifest payload."""
exported_symbols = ["BundleArtifactWriter"]
categories = ["document artifacts"]
part_of = ["artifact bundle"]

[[terms]]
name = "artifact hash"
definition = """
The full 64-character lowercase SHA-256 hash of one bundle artifact's complete \
stored bytes. Its input is raw bytes, so it is not a content hash."""
categories = ["document artifacts"]
is_a = ["hash"]
part_of = ["artifact descriptor"]

[[terms]]
name = "artifact descriptor"
definition = """
A storage-owned manifest entry containing one bundle artifact's exact relative \
name, artifact hash, and byte length. It describes integrity and extent, not \
the artifact's domain-specific meaning."""
exported_symbols = ["ArtifactDescriptor"]
categories = ["document artifacts"]
part_of = ["bundle manifest"]

[[terms]]
name = "bundle manifest"
definition = """
A canonical JSON value stored as the final artifact-bundle child. It enumerates \
the bundle's exact artifact descriptors and carries an opaque strict JSON \
payload whose domain schema belongs to the caller."""
exported_symbols = ["BundleManifest"]
categories = ["document artifacts"]
part_of = ["artifact bundle"]

[[terms]]
name = "artifact bundle publication"
definition = """
The storage-owned operation that allocates a fresh location, admits independent \
writers for distinct artifact names, and begins terminal bundle-manifest \
publication only with a valid payload after every admitted writer has finalized \
successfully. Once that attempt begins, the operation exposes no supported \
mutation, retry, or republishing path."""
exported_symbols = ["ArtifactBundlePublication"]
categories = ["document artifacts"]

[[terms]]
name = "artifact bundle read"
definition = """
A bounded operation that validates and pins one completed bundle manifest before \
either auditing every declared bundle artifact or verified-consuming one \
selected artifact."""
exported_symbols = [
  "ArtifactBundleReader",
  "BundleReadLimits",
  "BundleReadError",
  "BundleIncompleteError",
]
categories = ["document artifacts"]

[[terms]]
name = "artifact bundle integrity audit"
definition = """
An artifact bundle read that eagerly verifies the complete bytes of every \
declared bundle artifact. Its successful result describes the bytes verified at \
audit time without claiming protection from later external filesystem \
mutation."""
categories = ["document artifacts"]
is_a = ["artifact bundle read"]

[[terms]]
name = "verified artifact consumption"
definition = """
An artifact bundle read that delivers one selected bundle artifact from its \
pinned descriptor while computing its artifact hash and byte length. It succeeds \
only after the consumer reaches end of file and both values match the artifact \
descriptor."""
exported_symbols = ["VerifyingArtifactReader"]
categories = ["document artifacts"]
is_a = ["artifact bundle read"]

[[terms]]
name = "artifact bundle publication failure"
definition = """
A typed refusal or failure to publish the terminal manifest for one artifact \
bundle publication. It preserves the publication phase, available replacement \
knowledge, and underlying cause needed to distinguish an unmet writer \
precondition, a known incomplete location, and an uncertain terminal manifest \
outcome."""
exported_symbols = ["BundlePublishError", "BundlePublicationPhase"]
categories = ["document artifacts"]

[[terms]]
name = "artifact bundle verification failure"
definition = """
A typed artifact bundle read failure identifying one declared artifact and the \
reason its recovered or consumed bytes did not complete verified agreement with \
the bundle manifest."""
exported_symbols = [
  "BundleVerificationError",
  "BundleVerificationReason",
]
categories = ["document artifacts"]
