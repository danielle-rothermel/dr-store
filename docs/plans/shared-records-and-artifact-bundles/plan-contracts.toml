# Proposed additions to .defs/contracts.toml for plan review. These contracts
# are not binding until implementation and their evidence checks land.

[[contracts]]
title = "PostgreSQL preserves the asynchronous backend contract"
statement = """
`PostgresBackend` supplies the awaited point and batch object and binding \
operations with the same typed outcomes and shared schema and key text domains \
as every other backend. Each non-empty write batch uses one database \
transaction, preserves the backend cancellation and exact-replay contract, and \
makes committed rows available to independently running clients without \
exposing a PostgreSQL-specific object-store or record-cache API."""
rationale = """
A shared deployment changes persistence scope and contention mechanism, not the \
observable storage model. One conformance suite across every backend prevents \
database-specific semantics from leaking through the foundational boundary."""
date = "2026-08-08"

[[contracts]]
title = "PostgreSQL schema installation is explicit"
statement = """
PostgreSQL schema installation occurs only through the public asynchronous \
`install_postgres(pool)` operation against a caller-owned `asyncpg.Pool`. It \
supports PostgreSQL 16 through 18 databases whose server encoding is UTF-8, \
requires the fixed `dr_store` namespace to be absent, and creates that namespace \
and all storage tables together in one transaction. A repeated installation \
fails visibly rather than adopting or verifying existing objects. Backend \
construction and ordinary storage operations require the installed tables and \
fail visibly when they are absent; they never create, alter, or upgrade tables \
as a side effect. The namespace is not configurable, and the initial storage \
contract defines no schema version table, compatibility negotiation, or \
migration framework."""
rationale = """
Explicit installation keeps deployment privileges and failure recovery outside \
arbitrary application startup. One absent-only namespace gives installation a \
deterministic ownership boundary without schema introspection or drift policy. \
Migration machinery remains outside the initial implementation until an actual \
schema evolution requires a separately reviewed contract."""
date = "2026-08-08"

[[contracts]]
title = "PostgreSQL uses one concrete caller-owned async pool"
statement = """
`asyncpg>=0.31.0` is a required runtime dependency. `PostgresBackend` accepts a \
concrete caller-owned `asyncpg.Pool` as its only connection source. It awaits \
release of every connection it acquires for an operation but never closes the \
caller-owned pool or governs resources owned by another backend instance or \
process. The backend defines no custom connection-source Protocol, optional \
import or dependency path, DSN acceptance or ownership, synchronous source, \
second ownership mode, or source-lifecycle API."""
rationale = """
A single concrete caller-owned boundary avoids freezing an adapter abstraction \
before a second implementation exists and avoids parallel import, construction, \
shutdown, and failure semantics for an optional or managed source."""
date = "2026-08-08"

[[contracts]]
title = "PostgreSQL preserves exact text identity"
statement = """
On supported UTF-8 PostgreSQL 16 through 18 databases, PostgreSQL stores opaque \
schemas and binding keys as text columns using `pg_catalog.ucs_basic`. Their \
equality and uniqueness never inherit the database default collation and \
preserve exact case-sensitive and non-ASCII string identity. Canonical JSON text \
is recovered without normalization and compared exactly by the backend contract. \
Hash columns separately accept only their declared full lowercase hexadecimal \
representation."""
rationale = """
Storage identity must have the same meaning in every deployment. Pinning text \
comparison prevents locale or database configuration from changing binding \
winners while retaining natural string values and diagnostics."""
date = "2026-08-08"

[[contracts]]
title = "PostgreSQL object lookup and batches scale by bounded chunks"
statement = """
The PostgreSQL objects table uses `PRIMARY KEY (content_hash, schema)`, or an \
equivalent key plus an index whose leading column is `content_hash`. Point \
methods may use point statements. Batch methods deduplicate identical object \
references before sending canonical object data, chunk requests by explicit \
driver and statement bounds, fetch bindings in set-based statements, fetch \
distinct referenced objects separately in set-based statements, and reconstruct \
binding results in Python. Database round trips grow with bounded chunks rather \
than entries, one canonical record is not transferred once per referring key, \
and each non-empty write batch uses one transaction."""
rationale = """
The semantic batch boundary must remain useful over a network database. \
Hash-leading lookup avoids scans for alternate-schema resolution, while \
set-based binding and distinct-object fetches prevent N-plus-one round trips and \
payload multiplication when many keys refer to one object."""
date = "2026-08-08"

[[contracts]]
title = "PostgreSQL credentials remain at the connection boundary"
statement = """
The PostgreSQL API accepts only the caller-owned pool and never accepts, \
stringifies, or retains a DSN or other credential-bearing connection value. It \
does not include one in representations, messages, logs, storage identities, or \
metadata that dr-store constructs. Driver exceptions remain available as causes \
rather than being recursively rewritten, and the connection path is exercised \
against password-authenticated PostgreSQL."""
rationale = """
Shared deployments require secrets that local trust authentication can hide \
from tests. Constraining dr-store-owned output prevents accidental disclosure \
without adding a fragile sanitizer for arbitrary third-party exception text."""
date = "2026-08-08"

[[contracts]]
title = "The bundle manifest is a closed versioned format"
statement = """
Every artifact bundle uses the regular direct-child filename `manifest.json`. \
Its canonical strict JSON value contains exactly the top-level keys `format`, \
`artifacts`, and `payload`; `format` is exactly \
`dr-store-artifact-bundle-v1`. Each artifact descriptor contains exactly \
`name`, `sha256`, and `byte_length`, and descriptors are ordered by exact \
artifact name. Public `ArtifactDescriptor` and `BundleManifest` are strict frozen \
`BaseModel` boundary models. Writers emit no unknown fields, readers reject \
unknown fields or unsupported format markers, and persisted wire literals are \
explicit constants rather than values derived from model field names."""
rationale = """
A closed self-identifying envelope separates storage integrity from caller \
meaning and fails closed on unsupported data. Explicit literals and golden tests \
make every persisted-format change a visible contract change rather than an \
incidental code rename."""
date = "2026-08-08"

[[contracts]]
title = "Artifact bundle publication is manifest-committed"
statement = """
`ArtifactBundlePublication.allocate(...)` owns one collision-safe fresh \
allocation. `open_artifact(...)` admits multiple active synchronous \
`BundleArtifactWriter` instances only for distinct exact names; each writer's \
`write(...)` accepts caller-supplied bytes incrementally, and \
`finalize()` completes its descriptor. Name reservation and writer-state changes \
are thread-safe; each writer owns one file and incremental SHA-256 state, while \
the publication schedules no tasks and multiplexes no bytes. A writer failure \
permanently prevents publication. `publish(payload)` is non-waiting: an active \
writer, a failed writer, or an invalid payload produces a visible precondition \
refusal before any manifest operation. Refusal for an active writer or invalid \
payload is nonterminal. Only a valid publish call after every admitted writer \
finalized successfully begins the one deterministic manifest attempt and makes \
the publication terminal. That attempt orders descriptors by exact name and \
exposes no retry, replacement, append, truncation, or retention operation. A \
reader recognizes a completed bundle only when it can read a valid bundle \
manifest."""
rationale = """
One API-level terminal transition distinguishes interrupted work from a \
completed publication without claiming a durable cross-process once-only lock. \
Independent distinct-name writers support concurrent producers without making \
the bundle a scheduler. Thread-safe admission and a non-waiting manifest gate \
preserve one deterministic terminal transition, while exact-byte storage leaves \
retention policy with the caller."""
date = "2026-08-08"

[[contracts]]
title = "Bundle descriptors define verified contents"
statement = """
The bundle manifest contains exactly one artifact descriptor for every bundle \
artifact and no duplicate exact artifact name. Each descriptor pins the \
artifact's relative name, full lowercase SHA-256 hash, and non-negative byte \
length. Files not named by the manifest are outside the bundle, are ignored by \
bundle verification, and are never returned as bundle artifacts."""
rationale = """
The manifest remains authoritative for every byte the bundle claims without \
requiring a coherent snapshot or lock over unrelated directory entries. Hash \
and length distinguish modification from truncation without assigning domain \
meaning to raw bytes."""
date = "2026-08-08"

[[contracts]]
title = "Bundle artifact names are safe direct children"
statement = """
Every artifact name is one non-empty relative path segment. Publication and \
reading reject absolute paths, dot segments, separators, reserved temporary or \
manifest names. Descriptor names are unique by exact string, and artifact \
creation is exclusive and never replaces an existing child; the format defines \
no cross-platform case-folding or Unicode-normalization profile."""
rationale = """
Restricting artifacts to exclusively created direct children keeps publication \
and verification inside one directory boundary. It prevents traversal and \
replacement without introducing a portable-filename subsystem merely to predict \
every filesystem's aliasing rules."""
date = "2026-08-08"

[[contracts]]
title = "Artifact bundle integrity audits verify every declared file"
statement = """
`ArtifactBundleReader(path, limits)` accepts public `BundleReadLimits` for \
manifest bytes, manifest nesting depth, artifact count, bytes per artifact, and \
total artifact bytes. Its explicit `audit()` operation first validates and pins \
one canonical bundle manifest, then opens each declared regular direct-child \
artifact with required no-follow, directory-relative behavior and streams from \
the descriptor it inspected. It returns verified descriptor metadata only after \
every declared file has the exact descriptor byte length and hash; files outside \
the manifest are not inspected. The result describes bytes verified at audit \
time and does not claim that external actors cannot later mutate a path. Missing \
platform support, an exceeded bound, or any declared-file mismatch fails through \
a typed read error."""
rationale = """
Descriptor-pinned reads prevent name replacement between inspection and use, \
while eager bounded verification gives explicit integrity-audit callers one \
accepted state without loading whole artifacts into memory. The point-in-time \
guarantee remains no stronger than the bytes the auditor actually recovered."""
date = "2026-08-08"

[[contracts]]
title = "Verified artifact consumption reads selected content once"
statement = """
`ArtifactBundleReader.consume_and_verify_artifact(...)` validates and pins one \
canonical bundle manifest under its limits, opens one selected declared regular \
direct-child artifact with the same no-follow and directory-relative \
requirements as an integrity audit, and invokes a synchronous consumer callback \
with a package-owned `VerifyingArtifactReader`. That facade exposes only \
`read(...)` while hashing and counting those same descriptor bytes. The operation \
reports success only after the consumer reaches end of file and the exact \
descriptor hash and byte length agree. Early consumer termination is incomplete \
consumption, never verified success. A successful operation returns verified \
descriptor metadata and makes no claim about a later path read."""
rationale = """
Consumption-coupled verification avoids the mandatory verify-then-read double \
pass for large artifacts while retaining descriptor lifetime and terminal \
integrity checks inside one storage-owned operation."""
date = "2026-08-08"

[[contracts]]
title = "Artifact bundle failures use one small typed hierarchy"
statement = """
`ArtifactBundleError` is the common base. `BundleAllocationError` reports fresh \
allocation or artifact-writer admission failure. `BundlePublishError` reports a \
publication precondition or terminal-manifest phase through public \
`phase: BundlePublicationPhase` and \
`replacement_state: ReplacementState | None` fields; replacement state is \
absent for a precondition refusal and uses the existing public \
`ReplacementState` for a terminal manifest attempt. `BundleReadError` reports \
manifest, filesystem, or consumption failure; `BundleIncompleteError` and \
`BundleVerificationError` specialize it for a missing valid terminal manifest \
and a declared-artifact mismatch or incomplete consumption. Verification \
failures expose public `artifact_name: str` and \
`reason: BundleVerificationReason` fields. Translated document, consumer, and \
operating-system exceptions remain available as causes rather than becoming the \
primary bundle error."""
rationale = """
These categories distinguish recovery-relevant publication, incompleteness, and \
integrity outcomes without exposing implementation exceptions or freezing one \
public type for every low-level failure step."""
date = "2026-08-08"

[[contracts]]
title = "Completed bundles claim visibility without crash durability"
statement = """
Each artifact writer hashes the exact supplied bytes, flushes userspace buffers, \
and closes its descriptor. Manifest publication writes and closes one \
same-directory temporary manifest and atomically replaces `manifest.json`. The \
default path does not call `F_FULLFSYNC`, `fsync`, or a directory flush and \
defines no configurable durability mode. A completed bundle is terminal and \
process-visible through the supported API, without claiming protection from \
external filesystem mutation or survival across process, machine, filesystem, \
or power failure."""
rationale = """
Close and same-directory replacement support the intended process-visible \
terminal boundary. Omitting storage barriers avoids paying per-artifact crash \
durability costs for a capability that deliberately makes no such guarantee; a \
future crash-durable publication requires its own design."""
date = "2026-08-08"

[[contracts]]
title = "Artifact bundle operations remain synchronous and offloadable"
statement = """
Artifact writer, manifest publication, integrity-audit, and verified-consumption \
operations are synchronous and the package owns no event loop, executor, or \
async filesystem twin. An async caller offloads one complete bundle operation; \
it does not run package hashing or filesystem I/O on its event-loop thread or \
split one operation across independently scheduled per-chunk calls."""
rationale = """
Keeping descriptor ownership and terminal verification inside one synchronous \
operation makes the boundary deterministic. Async applications can choose and \
govern their executor without duplicating the bundle API or hiding thread-pool \
policy inside storage."""
date = "2026-08-08"

[[contracts]]
title = "The directory bundle format has an explicit workload ceiling"
statement = """
One artifact bundle represents one task, run, or result publication and is never \
a per-event record or packed execution-record backend. Callers own partitioned \
allocation roots and retention. Sustained creation near 100,000 bundles per hour \
is outside the intended directory-format envelope and requires aggregation or a \
separately designed blob-storage capability."""
rationale = """
Each bundle consumes a directory, manifest, and artifact filesystem entries. An \
explicit granularity and rate ceiling prevents a local terminal-publication \
primitive from being mistaken for a high-volume record or retention system."""
date = "2026-08-08"

[[contracts]]
title = "Artifact bundles do not own domain meaning"
statement = """
The bundle format owns artifact names, byte lengths, hashes, completeness, and \
verification. The bundle manifest carries a separate opaque strict JSON payload; \
evaluation, provider, corpus, experiment, and other caller packages own that \
payload's schema and all interpretation of the described artifacts."""
rationale = """
Separating a general integrity envelope from caller-owned metadata lets one \
publication primitive serve unrelated domains without making dr-store an owner \
of their evidence, identity, or analysis models."""
date = "2026-08-08"
