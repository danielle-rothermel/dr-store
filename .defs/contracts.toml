``PostgresBackend`` as the checkpoint integration surface, including verified \
read helpers that mirror ``get``, ``get_many``, and ``resolve`` on a \
caller-owned connection. Enlisted ``get_bound_objects_enlisted`` reads \
bindings and objects on that connection and observes one caller-transaction \
snapshot, including uncommitted writes in that transaction. Enlisted writes \
share the caller transaction; dr-store defines no savepoint API, so an evidence \
persistence failure aborts the enclosing checkpoint transaction. Binding \
deletion is available only on the awaited path, so the enlisted surface carries \
