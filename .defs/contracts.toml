[[contracts]]
title = "Artifact bundle publication is manifest-committed"
statement = """
`ArtifactBundlePublication.allocate(...)` owns one collision-safe fresh \
document-directory allocation. `open_artifact(...)` admits multiple active \
synchronous `BundleArtifactWriter` instances only for distinct exact names; \
each writer's `write(...)` accepts caller-supplied bytes incrementally, and \
`finalize()` completes its descriptor. Name reservation and writer-state changes \
are thread-safe; each writer owns one file and incremental SHA-256 state, while \
the publication schedules no tasks and multiplexes no bytes. A duplicate \
rejection before admission does not poison the publication, while any admitted \
create, write, or finalize failure permanently prevents publication. \
`publish(payload)` is non-waiting: an active writer, a failed writer, or an \
invalid payload produces a visible precondition refusal before any manifest \
operation. Refusal for an active writer or invalid payload is nonterminal. Only \
a valid publish call after every admitted writer finalized successfully begins \
the one deterministic manifest attempt and makes the publication terminal. That \
attempt orders descriptors by exact name, runs as one document-directory \
Manifest publication, and exposes no retry, replacement, append, truncation, \
retention, or later mutation operation. Publication bounds the encoded manifest \
by one fixed package ceiling of 1 GiB rather than a caller-supplied limit, and \
an encoded manifest above that ceiling is refused at `encode_manifest` with \
`ReplacementState.NOT_REPLACED`. Readers bound the manifest by their own \
`BundleReadLimits.manifest_max_bytes`, so a caller whose payload exceeds the \
read limit it later supplies publishes a bundle it cannot read back."""
rationale = """
One API-level terminal transition distinguishes interrupted work from a \
completed publication without claiming a durable cross-process once-only lock. \
Independent distinct-name writers support concurrent producers without making \
the bundle a scheduler, and delegating the terminal attempt keeps exactly one \
atomic same-directory replacement implementation in the package. A fixed \
publication ceiling keeps the publisher from accepting a manifest no bounded \
reader could recover, while leaving read bounds with the caller who owns the \
payload."""
date = "2026-08-12"
check = "uv run pytest -q tests/artifact_bundle/test_publication.py tests/artifact_bundle/test_failures.py"

[[contracts]]
title = "Bundle descriptors define verified contents"
statement = """
The bundle manifest contains exactly one artifact descriptor for every bundle \
artifact and no duplicate exact artifact name. Each descriptor pins the \
artifact's relative name, full lowercase SHA-256 hash, and non-negative byte \
length. Files not named by the manifest are outside the bundle, are ignored by \
bundle verification, and are never returned as bundle artifacts."""
rationale = """
The manifest remains authoritative for every byte the bundle claims without \
requiring a coherent snapshot or lock over unrelated directory entries. Hash \
and length distinguish modification from truncation without assigning domain \
meaning to raw bytes."""
date = "2026-08-12"
check = "uv run pytest -q tests/artifact_bundle/test_publication.py tests/artifact_bundle/test_models.py tests/artifact_bundle/test_reading.py::test_audit_verifies_every_declared_artifact_and_ignores_other_files"

[[contracts]]
title = "Bundle artifact names are safe exact direct children"
statement = """
Every artifact name is one non-empty relative path segment. Publication and \
reading both reject absolute paths, dot segments, separators, \
`manifest.json`, and the `.dr-store-artifact-bundle-` prefix. Admission is \
stricter than the recorded format by exactly one rule: publication also \
refuses the case-insensitive `.dr-store-document-` temporary namespace that \
manifest publication reserves, while reading admits descriptor names within \
it. Descriptor names are unique by exact string, and artifact creation is \
exclusive and never replaces an existing child. The format defines no \
cross-platform case-folding or Unicode-normalization profile."""
rationale = """
Restricting artifacts to exclusively created direct children prevents lexical \
traversal and replacement without introducing a portable-filename subsystem \
merely to predict every filesystem's aliasing rules. Reserving the document \
temporary namespace through the document layer's own public predicate keeps \
one source of truth for the names publication may create, and reserving the \
bundle prefix keeps every name an earlier release refused refused, so bundle \
names stay symmetric across releases. That document-namespace reservation \
binds admission only: an earlier release recorded such names legitimately, so \
applying it to reads would make already-recorded bundles unreadable, which \
name hygiene for new writers does not justify."""
date = "2026-08-12"
check = "uv run pytest -q tests/artifact_bundle/test_models.py tests/artifact_bundle/test_publication.py tests/artifact_bundle/test_reading.py && scripts/check-compatibility.sh"

[[contracts]]
title = "Artifact bundle reads are layered over storage primitives"
statement = """
`ArtifactBundleReader(path, *, limits)` accepts frozen public \
`BundleReadLimits` with `manifest_max_bytes`, `manifest_max_depth`, \
`max_artifacts`, `max_bytes_per_artifact`, and `max_total_artifact_bytes`. \
Every read validates the terminal manifest as one bounded canonical \
document-directory Manifest, then checks all declared bounds before any \
artifact work. Every declared or selected artifact is recovered by exactly one \
`read_verified_regular_child` call, so each recovery is bounded, no-follow, \
directory-relative, descriptor-pinned, and verified against the descriptor's \
byte length and SHA-256 before its bytes are returned. The package contains no \
second verified-read and no second atomic-replacement implementation. \
Descriptor pinning holds within each primitive call rather than across a whole \
read operation, and results describe bytes verified at read time without \
claiming that external actors cannot later mutate a path. Missing platform \
support, an exceeded bound, or any declared-file mismatch fails through a typed \
read error."""
rationale = """
Reusing the storage-owned read-and-verify primitive keeps one audited \
descriptor-pinned recovery path for every bundle artifact and removes a parallel \
implementation that could drift from it. The point-in-time guarantee remains no \
stronger than the bytes the reader actually recovered and does not claim \
ancestor-path containment."""
date = "2026-08-12"
check = "uv run pytest -q tests/artifact_bundle/test_reading.py"

[[contracts]]
title = "Artifact bundle integrity audits verify every declared file"
statement = """
Each `audit()` validates one regular direct-child canonical manifest, checks \
all declared bounds before artifact work, then recovers and verifies every \
declared regular direct-child artifact. It returns the verified \
`BundleManifest` only after every declared file has the exact descriptor byte \
length and SHA-256. Files outside the manifest are not inspected."""
rationale = """
Eager bounded verification gives integrity-audit callers one accepted state for \
the whole bundle, while ignoring undeclared entries keeps the manifest \
authoritative without locking unrelated directory contents."""
