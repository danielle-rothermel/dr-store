check = "uv run pytest -q tests/artifact_bundle/test_reading.py::test_audit_verifies_every_declared_artifact_and_ignores_other_files tests/artifact_bundle/test_reading.py::test_audit_reports_exact_artifact_verification_reason"

[[contracts]]
title = "Verified artifact consumption delivers only verified bytes"
statement = """
`ArtifactBundleReader.consume_and_verify_artifact(...)` validates one canonical \
manifest under its limits, recovers one selected declared artifact by a single \
bounded verified whole-read, and only then invokes one synchronous consumer \
callback with a package-owned `VerifyingArtifactReader`. A selected artifact \
must therefore fit within `max_bytes_per_artifact` and \
`max_total_artifact_bytes`, and bytes that fail descriptor verification are \
never delivered. The facade exposes only `read(...)` while hashing and counting \
the exact bytes it delivered. `read(0)` is not EOF, and consuming exactly the \
declared length without a later empty read is incomplete. The operation \
succeeds only after observed EOF and exact descriptor hash and byte-length \
agreement, returns the verified `ArtifactDescriptor`, and invalidates the \
facade before returning. It makes no claim about a later path read."""
rationale = """
Recovering through the shared verified-read primitive removes the package's \
bespoke streaming reader while keeping consumption-coupled verification \
observable to callers. Refusing unverified bytes is the stricter behavior and \
costs only the residency bound the limits already declare."""
date = "2026-08-12"
check = "uv run pytest -q tests/artifact_bundle/test_reading.py::test_verified_consumption_reads_selected_content_once tests/artifact_bundle/test_reading.py::test_verified_consumption_requires_observed_eof tests/artifact_bundle/test_reading.py::test_consumer_is_called_once_and_facade_is_invalid_after_callback tests/artifact_bundle/test_reading.py::test_consumption_refuses_mutated_bytes_before_delivering_them"

[[contracts]]
title = "Artifact bundle failures use one small typed hierarchy"
statement = """
`ArtifactBundleError` is the common base. `BundleAllocationError` reports fresh \
allocation and artifact-writer admission failures. `BundlePublishError` reports \
a publication precondition or terminal-manifest phase through public \
`phase: BundlePublicationPhase` and \
`replacement_state: ReplacementState | None` fields. Replacement state is \
absent for a precondition refusal and uses the existing public \
`ReplacementState` for a terminal manifest attempt. The manifest temporary \
descriptor is closed within the document-directory write stage, so a close \
failure reports `write_temp`; `close_temp` remains a public member of \
`BundlePublicationPhase` that no path emits. `BundleReadError` reports \
manifest, filesystem, or consumer failure; `BundleIncompleteError` and \
`BundleVerificationError` specialize it for a missing valid terminal manifest \
and a selected or declared artifact mismatch or incomplete consumption. \
Verification failures expose public `artifact_name: str` and \
`reason: BundleVerificationReason` fields. Bundle failures raised over a \
storage primitive report the primitive's own underlying serialization, model, \
consumer, or operating-system exception as their cause rather than the \
intermediate primitive error."""
rationale = """
These categories distinguish recovery-relevant allocation, refusal, and \
terminal-manifest outcomes without freezing one public exception type for every \
low-level writer step. Reporting the originating cause keeps the layering an \
implementation detail rather than a change to what callers can diagnose."""
date = "2026-08-12"
check = "uv run pytest -q tests/artifact_bundle/test_failures.py tests/artifact_bundle/test_reading.py tests/test_public_api.py::test_artifact_bundle_public_surfaces_are_exact"

[[contracts]]
title = "Completed bundles claim visibility without crash durability"
statement = """
Each artifact writer hashes the exact supplied bytes, flushes userspace buffers, \
and closes its descriptor. Manifest publication writes and closes one \
same-directory temporary document and atomically replaces `manifest.json`. The \
path does not call `F_FULLFSYNC`, `fsync`, or a directory flush and defines no \
configurable durability mode. Successful publication is terminal and \
process-visible, without claiming protection from external filesystem mutation \
or survival across process, machine, filesystem, or power failure."""
rationale = """
Close and same-directory replacement support the intended process-visible \
terminal boundary. A future crash-durable publication requires its own design \
rather than an option on this capability."""
date = "2026-08-12"
check = "uv run pytest -q tests/artifact_bundle/test_failures.py::test_publication_never_uses_file_or_directory_sync tests/artifact_bundle/test_failures.py::test_manifest_replacement_is_same_directory tests/artifact_bundle/test_reading.py::test_directory_is_pinned_within_one_verified_child_read"

[[contracts]]
title = "Artifact bundle operations remain synchronous and offloadable"
statement = """
Artifact writer, manifest publication, integrity-audit, and verified-consumption \
operations are synchronous, and the package owns no event loop, executor, \
scheduler, or async filesystem twin. An async caller offloads one complete \
bundle operation rather than running package hashing or filesystem I/O on its \
event-loop thread or splitting one operation across independently scheduled \
per-chunk calls."""
rationale = """
Keeping file ownership and the terminal transition inside synchronous operations \
makes the boundary deterministic while leaving executor policy with async \
applications."""
