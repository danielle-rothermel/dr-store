[[contracts]]
title = "Record cache reads are best-effort and entries are never rebound"
statement = """
An awaited record-cache batch read deduplicates its input keys and returns \
exactly one typed hit or miss for every distinct exact requested key. It \
validates the requested schema before awaiting storage and parses and verifies \
each returned bound object once. An unbound key, missing content, schema \
mismatch, and unverifiable stored object or binding all report a per-key miss; \
invalid requested schemas, cancellation, and operational backend failures \
propagate. Unverifiable stored objects and bindings increment \
`RecordCache.stats.corruption_count` and log the corrupted key without changing \
miss semantics. An awaited cache batch put validates, canonicalizes, and hashes every \
proposed entry before one backend write batch, then returns the first binding \
winner for each input key. Invalidation selects a new caller-owned key rather \
than deleting or expiring an entry, and a batch read claims no single snapshot \
across backend read chunks."""
rationale = """
Expected absence and unverifiable stored data do not prevent recomputation, \
while caller errors, cancellation, and unavailable storage stay visible. \
Preparing caller data before the first await prevents validation faults from \
starting storage work. First-writer-wins and exact replay keep cache bindings \
stable even when a cancelled write has an uncertain observed outcome."""
date = "2026-08-08"
check = "uv run pytest -q tests/record_cache/test_cache.py"

[[contracts]]
title = "Managed SQLite record caches own their complete lifecycle"
statement = """
`SqliteRecordCache.open(...)` returns only after its owned SQLite backend, \
dedicated worker, connection, and schema are ready and binds those resources to \
the event loop performing the open. While resources remain open, every cache \
operation and `aclose()` must run on that loop; cross-loop use fails visibly. \
Each single or bulk cache read or write is admitted as one whole operation while \
open. The cache is a long-lived resource; no supported path opens and closes it \
around one record operation. `aclose()` rejects new operations with a typed \
closed error, waits for every admitted operation and its worker cleanup to \
settle, and then closes the backend resources owned by that instance. Async \
context exit performs the same close; direct construction, lazy initialization, \
and context-entry-only initialization are not public paths. Once close begins \
the lifecycle remains terminal; cancelling one close waiter does not cancel \
shared cleanup or reopen the cache. Concurrent and later close callers observe \
the same successful or typed terminal-failure outcome, and successful close is \
idempotent. The persistent database path is made absolute during open without \
freezing symlink targets, transient paths are rejected, completed commits \
persist across close and reopen, and separate instances and processes retain \
independent lifecycles even when they use the same path."""
rationale = """
Whole-operation admission prevents asynchronous shutdown from invalidating work \
between binding and object-store steps. One shared terminal cleanup operation \
keeps cancellation from abandoning SQLite worker resources or creating a reopen \
path, while persistence remains a property of committed rows rather than a \
power-loss or process-global lifecycle guarantee."""
date = "2026-08-08"
check = "uv run pytest -q tests/record_cache/test_sqlite_cache.py tests/storage_backends/test_sqlite_backend.py"

[[contracts]]
title = "PostgreSQL preserves the asynchronous backend contract"
statement = """
`PostgresBackend.open(engine)` validates the installed schema format before \
returning a backend that supplies the awaited point and batch object and \
binding operations with the same typed outcomes and shared schema and key text \
domains as every other backend. Each non-empty write batch uses one database \
transaction on the auto-commit path, preserves exact replay, releases \
connections acquired on that path before the operation completes, and makes \
committed rows available to independently running clients without exposing a \
