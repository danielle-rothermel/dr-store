[[contracts]]
title = "Sidecar verification pins no-follow descriptors"
statement = """
Sidecar verification opens the named document directory and its regular direct \
child with required no-follow, directory-relative flags, reads from the child \
descriptor it inspected, and verifies the caller-supplied non-negative head and \
tail lengths plus sidecar hash. It rejects final-component symlinks and fails \
closed when the required platform support is unavailable. Failures raise \
`SidecarVerificationError` with `RegularChildFailureReason`."""
rationale = """
Pinned descriptors prevent a checked child name from being swapped to a \
different final object before reading. This boundary does not claim containment \
for ancestor path resolution, durability, or safety for sidecar creation, which \
follows its documented path behavior."""
date = "2026-08-08"
