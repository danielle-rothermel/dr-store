[[contracts]]
title = "Content hashes use the canonical JSON profile"
statement = """
Content hashing validates a complete strict JSON record and computes its full \
lowercase SHA-256 hash through the frozen canonical JSON profile; storage does \
not define a second canonicalization or hash input."""
rationale = """
One canonical profile keeps stored addresses reproducible and prevents the \
storage layer from silently assigning different bytes to the same accepted \
record. A content hash covers the complete record, not caller-selected \
identity facts."""
date = "2026-08-05"
check = "uv run pytest -q tests/content_addressing/test_content_addressing.py"

[[contracts]]
title = "Object references validate their declared parts"
statement = """
An object reference contains a schema from the shared text domain and a \
64-character lowercase hexadecimal content hash. Schemas are non-empty and \
contain neither NUL nor unpaired surrogate code points. Construction and every \
public backend or facade path that accepts schema text reject any other shape \
before storage work begins."""
rationale = """
One validation domain prevents direct backend use from bypassing the object \
reference boundary while retaining every other schema character as opaque \
caller-owned text. This validation does not claim that referenced content \
already exists."""
date = "2026-08-08"
check = "uv run pytest -q tests/content_addressing/test_content_addressing.py tests/object_store tests/storage_backends/test_contract.py tests/record_cache/test_cache.py"

[[contracts]]
title = "Object puts are immutable"
statement = """
An immutable put stores validated canonical record text at an absent schema \
and content-hash pair, treats identical canonical text as an idempotent replay, \
and raises a typed conflict for different text while preserving the existing \
stored row."""
rationale = """
Insert-if-absent semantics make a reference stable after its first successful \
write. The conflict path remains explicit even though a differing value at the \
same full digest should be exceptional."""
date = "2026-08-05"
check = "uv run pytest -q tests/object_store/test_put_get.py"

[[contracts]]
title = "Object gets verify stored content"
statement = """
Every object get resolves the requested schema and content hash, parses the \
stored text as strict JSON within the canonical profile, recomputes the \
reference hash and canonical text, and returns the record only when all checks \
agree; missing, wrong-schema, and corrupt content fail through typed errors."""
rationale = """
The backend is a storage mechanism rather than a trust boundary, so reads do \
not accept stored bytes merely because they occupy the requested location."""
date = "2026-08-05"
check = "uv run pytest -q tests/object_store/test_put_get.py"

[[contracts]]
title = "Bindings are single-assignment"
statement = """
Binding an unbound caller-owned key stores one object reference atomically; \
replaying the same reference is idempotent, and requesting a different \
reference raises a typed conflict that preserves the existing winner. Binding \
keys may be empty and contain any text except NUL or unpaired surrogate code \
points. Every public backend and facade binding path validates that domain \
before storage work begins, and the object-store surface exposes no clear, \
overwrite, or rebind operation."""
rationale = """
Single assignment makes a successful key resolution stable while allowing \
concurrent contenders to observe one correlated winner. One shared permissive \
text domain preserves opaque caller-owned keys without letting backend-specific \
string constraints select different winners."""
date = "2026-08-08"
check = "uv run pytest -q tests/object_store/test_binding.py tests/storage_backends/test_contract.py tests/record_cache/test_cache.py"

[[contracts]]
title = "Backends own atomicity and declare persistence scope"
statement = """
Every backend supplies awaited atomic insert-if-absent operations for object \
rows and bindings, exact-key reads that return bindings with their referenced \
object rows, and atomic write batches that store prepared objects and establish \
each key's first-writer binding. An operation releases no transaction or shared \
connection until driver cleanup makes that resource reusable. Cancellation is \
an operational failure and does not prove whether a write committed; storage \
performs no automatic retry, while exact immutable replay remains supported. The \
in-memory backend is process-local. Each SQLite backend owns one dedicated \
worker and one connection and admits at most one submitted or running worker \
operation. Other callers await an async admission gate before work is submitted. \
The worker executes complete operations outside the event-loop thread, chunks \
exact-key reads into joined queries without promising one batch-wide snapshot, \
and uses one immediate transaction for each non-empty write batch. Cancellation \
while awaiting admission starts no SQLite work. A cancelled admitted operation \
does not abandon its worker work: the caller waits until the operation and its \
cleanup settle, then cancellation wins. If that worker path also fails, its \
failure remains the cause of the cancellation. SQLite requires a non-transient \
filesystem path, captures its lexical absolute path during open, retains \
committed rows across reopen, and supports cross-process contention without \
claiming power-loss durability. Empty and `:memory:` paths are rejected; the \
captured absolute path prevents later working-directory redirection but does not \
freeze symlink targets."""
rationale = """
The object store owns hashing, verification, idempotency, and typed conflicts, \
while each asynchronous backend owns the atomic storage and resource-cleanup \
primitives those rules require. Keeping blocking SQLite work off the event loop \
provides one awaited backend contract without pretending SQLite itself is \
non-blocking. Unknown cancellation outcomes remain truthful and recoverable \
through exact replay rather than hidden retries."""
date = "2026-08-08"
check = "uv run pytest -q tests/storage_backends/test_contract.py tests/storage_backends/test_sqlite_backend.py"

[[contracts]]
title = "SQLite backends own one asynchronous worker lifecycle"
statement = """
`SqliteBackend.open(...)` returns only after its dedicated worker, connection, \
and schema are ready and binds those resources to the event loop performing the \
open. While resources remain open, every backend operation and `aclose()` must \
run on that loop; cross-loop use fails visibly. The instance admits each point \
or batch request as one whole serialized worker operation. The backend is a \
long-lived resource; no supported path opens and closes it around one record \
operation. `aclose()` rejects new work, waits for every admitted operation and \
its cleanup to settle, closes the connection and worker, and leaves the instance \
terminal; successful close is idempotent. A raw backend storage operation after \
close raises `RuntimeError`; no new public backend-closed exception is defined. \
Async context exit performs the same close, while direct construction, lazy \
first-use initialization, and context-entry-only initialization are not public \
paths."""
rationale = """
One connection-affine worker makes SQLite transaction and cancellation behavior \
predictable without consuming the process-wide executor or inventing parallel \
read machinery. Awaited opening and terminal close prevent callers from \
observing a partially initialized or reopened backend."""
date = "2026-08-08"
check = "uv run pytest -q tests/storage_backends/test_sqlite_backend.py tests/test_public_api.py"

[[contracts]]
title = "SQLite indexing and synchronization match its persistence claim"
statement = """
The async SQLite backend uses WAL with `synchronous=NORMAL` and defines no \
public durability mode. The objects table uses `PRIMARY KEY (content_hash, \
schema)`, or an equivalent key plus an index whose leading column is \
`content_hash`, so exact and alternate-schema lookups are indexed. A missing or \
wrong-schema lookup must not scan the object table. Completed commits persist \
across ordinary close and reopen and the database recovers validly after process \
failure, without promising survival of the last acknowledged transaction across \
power loss."""
rationale = """
Hash-leading lookup prevents the required schema-mismatch distinction from \
becoming linear in stored object count. WAL NORMAL avoids a durable synchronization \
barrier for every small commit while matching the deliberately bounded \
persistence claim."""
date = "2026-08-08"
check = "uv run pytest -q tests/storage_backends/test_sqlite_backend.py"

[[contracts]]
title = "Callers own domain meaning"
statement = """
Schemas and binding keys are opaque within their shared validated text domains, \
and manifest payload fields are opaque strict JSON. Callers own their meaning, \
identity selection, lifecycle, retention, cache scheduling, dirty tracking, key \
enumeration and prefix-query policy, and configured byte, depth, and sidecar cap \
policy; storage does not infer those domain rules or supply those cache policies."""
rationale = """
Keeping domain policy outside the foundational storage boundary lets the same \
primitives serve unrelated consumers without silently redefining their data. \
The minimal shared text validation is a storage interoperability boundary, not \
domain interpretation."""
date = "2026-08-08"
check = "uv run pytest -q tests/object_store/test_binding.py tests/record_cache/test_cache.py tests/document_directory/test_manifest.py"

[[contracts]]
title = "Document Directory allocation never reuses a collision"
statement = """
Allocation validates the prefix and manifest name as single path segments and \
creates one fresh directory named from that prefix, a UTC timestamp, and a \
UUID. A generated-name collision raises a typed error without retry or reuse, \
and allocation does not flush the caller-owned root directory."""
rationale = """
A collision must remain visible rather than attaching a new artifact to an \
existing directory. Not flushing the root keeps the durability boundary \
truthful: allocation alone does not promise survival across power loss."""
date = "2026-08-05"
check = "uv run pytest -q tests/document_directory/test_directory.py"

[[contracts]]
title = "Canonical document publication uses same-directory replacement"
statement = """
A standalone canonical document file validates one complete strict JSON value \
within its caller-supplied byte and nesting-depth bounds before filesystem \
publication. Publication writes the complete canonical bytes to a reserved \
same-directory temporary file created with private permissions, flushes and \
closes that file, replaces the target, and then flushes and closes the \
directory. Its lexical absolute directory path is captured at construction; \
this prevents working-directory redirection but does not freeze symlink \
targets. All-or-nothing visibility depends on the filesystem's same-directory \
replacement semantics, \
and no power-loss durability is promised."""
rationale = """
Pre-publication bounds prevent an accepted write from exceeding the matching \
read contract. Same-directory replacement avoids exposing a partial target, \
while the filesystem and power-loss limitations keep visibility and durability \
claims no stronger than the available evidence."""
date = "2026-08-06"
check = "uv run pytest -q tests/document_file"

[[contracts]]
title = "Document publication failures report phase and replacement"
statement = """
A failed publication reports `ENCODE`, `CREATE_TEMP`, `WRITE_TEMP`, \
`FLUSH_TEMP`, `REPLACE_TARGET`, or `FLUSH_DIRECTORY`. `CREATE_TEMP` includes \
directory acquire and temporary-file open; `FLUSH_TEMP` includes flush and \
close; `FLUSH_DIRECTORY` includes directory flush and close. \
`replacement_state = NOT_REPLACED` means replacement was not invoked and a \
prior target, if any, stays authoritative. `REPLACED` means replacement \
returned successfully and later finalization failed. `UNKNOWN` means the \
replacement operation reported a failure, so the target may contain either \
the prior or proposed document and the caller must inspect or coordinate before \
treating either value as authoritative."""
rationale = """
Callers can distinguish failures that preserve the prior target from failures \
reported after confirmed replacement while retaining uncertainty when an \
operating-system replacement error does not prove whether the target changed."""
date = "2026-08-06"
check = "uv run pytest -q tests/document_file/test_failures.py tests/document_file/test_interrupted_publication.py"

[[contracts]]
title = "Concurrent document publishers use independent temporary files"
statement = """
Every supported publication reserves a unique temporary child name from the \
case-insensitive `.dr-store-document-` namespace, which document targets and \
document-directory sidecars may not use. Concurrent publishers do not share \
temporary files; each successful replacement publishes one complete document, \
and the last successful replacement is authoritative. Publication provides no \
lock, compare-and-set operation, or multi-file transaction."""
rationale = """
Independent temporary files prevent concurrent publishers from corrupting one \
another's staged bytes. Replacement order defines the winner without claiming \
serialization, conditional update, or coordination across related artifacts."""
date = "2026-08-06"
check = "uv run pytest -q tests/document_file/test_canonical_json.py::test_two_publishers_use_distinct_temps_and_last_replacement_wins"

[[contracts]]
title = "Canonical document reads are bounded and descriptor-pinned"
statement = """
A standalone document read opens the named directory and its regular direct \
child under the absolute directory path captured at construction with required \
no-follow, directory-relative flags, reads no more than one \
byte beyond the caller-supplied byte bound from the child descriptor it \
inspected, and accepts only one complete UTF-8 strict JSON value within the \
configured nesting-depth bound whose stored bytes exactly equal its canonical \
JSON bytes. Every open, read, close, decoding, bounds, or canonicality failure \
raises a typed document-read error, and unsupported platforms fail closed."""
rationale = """
Pinned descriptors keep a concurrent replacement from changing the object \
mid-read. Exact bounded read-back rejects symlinks, non-regular files, malformed \
or oversized content, and merely equivalent non-canonical documents without \
normalizing them on read."""
date = "2026-08-06"
check = "uv run pytest -q tests/document_file/test_canonical_json.py"

[[contracts]]
title = "Document directories delegate manifests to canonical files"
statement = """
A document directory requires caller-supplied manifest byte bounds, accepts an \
optional nesting-depth bound, and configures one standalone canonical document \
file for both manifest publication and instance reads. It translates \
standalone configuration, publication, and read failures into its established \
typed directory errors while preserving the originating error as the cause. \
One lexical absolute directory path is captured and shared by manifest and \
sidecar operations; symlink targets are not frozen. \
Manifest publication and reads retain the standalone file's bounds, phase, \
replacement, concurrency, and descriptor-pinning behavior. Manifest names and \
sidecar names may not use the canonical file's case-insensitive \
`.dr-store-document-` temporary namespace."""
rationale = """
One delegated implementation keeps manifest behavior aligned with standalone \
documents while preserving the Document Directory's contextual error surface \
and its separate Sidecar responsibilities."""
date = "2026-08-06"
check = "uv run pytest -q tests/document_directory/test_directory.py tests/document_directory/test_manifest.py"

[[contracts]]
title = "Sidecar finalization reports stored-byte accounting"
statement = """
A sidecar writer retains bytes under caller-supplied head and tail caps and, \
on successful finalization, flushes and closes its file descriptor before \
returning stored segment lengths, produced and dropped byte counts, and the \
SHA-256 digest of exactly the stored bytes. Finalization does not flush the \
directory entry or impose ordering on manifest publication."""
rationale = """
The summary makes truncation and the verified byte sequence explicit while \
avoiding stronger persistence or publication-order claims. A caller abandons \
a writer after a write failure because further use has no supported outcome."""
date = "2026-08-05"
check = "uv run pytest -q tests/document_directory/test_sidecar_writer.py"

[[contracts]]
title = "Sidecar verification pins no-follow descriptors"
statement = """
Sidecar verification opens the named document directory and its regular direct \
child with required no-follow, directory-relative flags, reads from the child \
descriptor it inspected, and verifies the caller-supplied non-negative head and \
tail lengths plus digest. It rejects final-component symlinks and fails closed \
when the \
required platform support is unavailable."""
rationale = """
Pinned descriptors prevent a checked child name from being swapped to a \
different final object before reading. This boundary does not claim containment \
for ancestor path resolution, durability, or safety for sidecar creation, which \
follows its documented path behavior."""
date = "2026-08-05"
check = "uv run pytest -q tests/document_directory/test_sidecar_verification.py"

[[contracts]]
title = "Record cache reads are best-effort and entries are never rebound"
statement = """
An awaited record-cache batch read deduplicates its input keys and returns \
exactly one typed hit or miss for every distinct exact requested key. It \
validates the requested schema before awaiting storage and parses and verifies \
each returned bound object once. An unbound key, missing content, schema \
mismatch, and unverifiable stored object or binding all report a per-key miss; \
invalid requested schemas, cancellation, and operational backend failures \
propagate. An awaited cache batch put validates, canonicalizes, and hashes every \
proposed entry before one backend write batch, then returns the first binding \
winner for each input key. Invalidation selects a new caller-owned key rather \
than deleting or expiring an entry, and a batch read claims no single snapshot \
across backend read chunks."""
rationale = """
Expected absence and unverifiable stored data do not prevent recomputation, \
while caller errors, cancellation, and unavailable storage stay visible. \
Preparing caller data before the first await prevents validation faults from \
starting storage work. First-writer-wins and exact replay keep cache bindings \
stable even when a cancelled write has an uncertain observed outcome."""
date = "2026-08-08"
check = "uv run pytest -q tests/record_cache/test_cache.py"

[[contracts]]
title = "Managed SQLite record caches own their complete lifecycle"
statement = """
`SqliteRecordCache.open(...)` returns only after its owned SQLite backend, \
dedicated worker, connection, and schema are ready and binds those resources to \
the event loop performing the open. While resources remain open, every cache \
operation and `aclose()` must run on that loop; cross-loop use fails visibly. \
Each single or bulk cache read or write is admitted as one whole operation while \
open. The cache is a long-lived resource; no supported path opens and closes it \
around one record operation. `aclose()` rejects new operations with a typed \
closed error, waits for every admitted operation and its worker cleanup to \
settle, and then closes the backend resources owned by that instance. Async \
context exit performs the same close; direct construction, lazy initialization, \
and context-entry-only initialization are not public paths. Once close begins \
the lifecycle remains terminal; cancelling one close waiter does not cancel \
shared cleanup or reopen the cache. Concurrent and later close callers observe \
the same successful or typed terminal-failure outcome, and successful close is \
idempotent. The persistent database path is made absolute during open without \
freezing symlink targets, transient paths are rejected, completed commits \
persist across close and reopen, and separate instances and processes retain \
independent lifecycles even when they use the same path."""
rationale = """
Whole-operation admission prevents asynchronous shutdown from invalidating work \
between binding and object-store steps. One shared terminal cleanup operation \
keeps cancellation from abandoning SQLite worker resources or creating a reopen \
path, while persistence remains a property of committed rows rather than a \
power-loss or process-global lifecycle guarantee."""
date = "2026-08-08"
check = "uv run pytest -q tests/record_cache/test_sqlite_cache.py tests/storage_backends/test_sqlite_backend.py"

[[contracts]]
title = "PostgreSQL schema installation is explicit"
statement = """
PostgreSQL schema installation occurs only through the public asynchronous \
`install_postgres(pool)` operation against a caller-owned `asyncpg.Pool`. It \
supports PostgreSQL 16 through 18 databases whose server encoding is UTF-8, \
requires the fixed `dr_store` namespace to be absent, and creates that namespace \
and its object and binding tables together in one transaction. A repeated or \
concurrent losing installation fails visibly rather than adopting existing \
objects. The namespace is not configurable, and installation defines no schema \
version table, compatibility negotiation, or migration framework."""
rationale = """
Explicit installation keeps deployment privileges and failure recovery outside \
arbitrary application startup. One absent-only namespace gives installation a \
deterministic ownership boundary without schema introspection or drift policy."""
date = "2026-08-08"
check = "scripts/test-postgres.sh tests/storage_backends/test_postgresql_install.py"

[[contracts]]
title = "PostgreSQL installation uses one concrete caller-owned async pool"
statement = """
`asyncpg>=0.31.0` is a required runtime dependency. `install_postgres` accepts a \
concrete caller-owned `asyncpg.Pool` as its only connection source. It releases \
the connection acquired for installation but never closes the pool. The \
installation API defines no custom connection-source Protocol, optional import \
or dependency path, DSN acceptance or ownership, synchronous source, second \
ownership mode, or source-lifecycle API."""
rationale = """
A single concrete caller-owned boundary avoids freezing an adapter abstraction \
before a second implementation exists and avoids parallel import, construction, \
shutdown, and failure semantics for an optional or managed source."""
date = "2026-08-08"
check = "scripts/test-postgres.sh tests/storage_backends/test_postgresql_install.py"

[[contracts]]
title = "PostgreSQL installation preserves exact text identity"
statement = """
On supported UTF-8 PostgreSQL 16 through 18 databases, the installed object and \
binding tables store schemas, binding keys, canonical JSON text, and hash text \
using `pg_catalog.ucs_basic`. Their equality and uniqueness do not inherit the \
database default collation and preserve exact case-sensitive and non-ASCII text. \
The object key is `PRIMARY KEY (content_hash, schema)`, and both hash columns \
accept only a full 64-character lowercase hexadecimal representation. The \
binding table deliberately defines no foreign key."""
rationale = """
Storage identity must have the same meaning in every deployment. Pinning text \
comparison prevents locale or database configuration from changing identity \
while the hash-leading object key supports exact and alternate-schema lookup."""
date = "2026-08-08"
check = "scripts/test-postgres.sh tests/storage_backends/test_postgresql_install.py"

[[contracts]]
title = "PostgreSQL installation keeps credentials at the connection boundary"
statement = """
The PostgreSQL installation API accepts only the caller-owned pool and never \
accepts, stringifies, or retains a DSN or other credential-bearing connection \
value. It does not include one in representations, messages, logs, storage \
identities, or metadata that dr-store constructs. Driver exceptions propagate \
without recursive rewriting, and the connection path is exercised against \
password-authenticated PostgreSQL."""
rationale = """
Shared deployments require secrets that local trust authentication can hide \
from tests. Constraining dr-store-owned output prevents accidental disclosure \
without adding a fragile sanitizer for arbitrary third-party exception text."""
date = "2026-08-08"
check = "scripts/test-postgres.sh tests/storage_backends/test_postgresql_install.py"
