[[contracts]]
title = "Canonical document reads are bounded and descriptor-pinned"
statement = """
A standalone document read opens the named directory and its regular direct \
child under the absolute directory path captured at construction with required \
no-follow, directory-relative flags, reads no more than one \
byte beyond the caller-supplied byte bound from the child descriptor it \
inspected, and accepts only one complete UTF-8 strict JSON value within the \
configured nesting-depth bound whose stored bytes exactly equal its canonical \
JSON bytes. Byte-bound failures raise `DocumentReadError` at `ReadStage.READ_BYTES` \
with `RegularChildFailureReason.BOUNDS_EXCEEDED`; nesting-depth bound failures raise at \
`ReadStage.DECODE`. Every other open, read, close, or canonicality failure \
raises `DocumentReadError` with `ReadStage` and `RegularChildFailureReason`. `MISSING` means \
the selected document is absent; every other reason means the document is \
present but invalid. Unsupported platforms fail closed."""
