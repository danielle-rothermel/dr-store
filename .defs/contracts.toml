[[contracts]]
title = "Verified regular-child reads are bounded and descriptor-pinned"
statement = """
``read_verified_regular_child`` opens the named directory and its regular \
direct child with required no-follow, directory-relative flags, reads no more \
than one byte beyond the caller-supplied ``max_bytes`` bound from the child \
descriptor it inspected, verifies the caller-supplied non-negative expected byte \
length and full lowercase SHA-256 digest, and returns exactly the verified \
bytes. Every open, read, bound, length, or digest failure raises \
`VerifiedRegularChildReadError` with `RegularChildFailureReason`, and \
