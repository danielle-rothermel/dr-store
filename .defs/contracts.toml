[[contracts]]
title = "The bundle manifest is a closed versioned format"
statement = """
Every artifact bundle uses the regular direct-child filename \
`manifest.json`. Its canonical strict JSON value contains exactly the top-level \
keys `format`, `artifacts`, and `payload`; `format` is exactly \
`dr-store-artifact-bundle-v1`. Each artifact descriptor contains exactly \
`name`, `sha256`, and `byte_length`, and descriptors are ordered by exact \
artifact name. Public `ArtifactDescriptor` and `BundleManifest` are strict \
frozen `BaseModel` boundary models. Writers emit no unknown fields; readers \
reject duplicate keys, unknown fields, unsupported format markers, unsorted or \
duplicate descriptors, non-strict JSON, and non-canonical bytes. Persisted wire \
literals are explicit constants rather than values derived from model field \
names."""
rationale = """
A closed self-identifying envelope separates storage integrity from caller \
meaning. Explicit literals and golden tests make every persisted-format change \
a visible contract change rather than an incidental code rename. Golden tests \
pin the stored manifest bytes so a bundle recorded by an earlier release stays \
readable. Golden tests pin those bytes from inside one installed version, so \
`scripts/check-compatibility.sh` exchanges bundles with an actually-installed \
earlier release to confirm the claim across versions."""
date = "2026-08-12"
