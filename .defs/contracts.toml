Async context exit performs the same close, while direct construction, lazy \
first-use initialization, and context-entry-only initialization are not public \
paths."""
rationale = """
One connection-affine worker makes SQLite transaction and cancellation behavior \
predictable without consuming the process-wide executor or inventing parallel \
read machinery. Awaited opening and terminal close prevent callers from \
observing a partially initialized or reopened backend."""
date = "2026-08-08"
check = "uv run pytest -q tests/storage_backends/test_sqlite_backend.py tests/test_public_api.py"

[[contracts]]
title = "SQLite indexing and synchronization match its persistence claim"
statement = """
The async SQLite backend uses WAL with `synchronous=NORMAL` and defines no \
public durability mode. The objects table uses `PRIMARY KEY (content_hash, \
schema)`, or an equivalent key plus an index whose leading column is \
`content_hash`, so exact and alternate-schema lookups are indexed. A missing or \
wrong-schema lookup must not scan the object table. Completed commits persist \
across ordinary close and reopen and the database recovers validly after process \
failure, without promising survival of the last acknowledged transaction across \
power loss."""
rationale = """
Hash-leading lookup prevents the required schema-mismatch distinction from \
becoming linear in stored object count. WAL NORMAL avoids a durable synchronization \
barrier for every small commit while matching the deliberately bounded \
persistence claim."""
date = "2026-08-08"
check = "uv run pytest -q tests/storage_backends/test_sqlite_backend.py"

[[contracts]]
title = "Callers own domain meaning"
