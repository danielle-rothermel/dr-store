[[contracts]]
title = "PostgreSQL schema installation is explicit"
statement = """
PostgreSQL schema installation occurs only through the public synchronous \
`install_postgres_sync(engine)` or asynchronous `install_postgres(engine)` \
operations against a caller-owned SQLAlchemy `Engine` or `AsyncEngine`. It \
supports PostgreSQL 16 through 18 databases whose server encoding is UTF-8, \
requires the fixed `dr_store` namespace to be absent, and creates that \
namespace and all storage tables together with exactly one schema-format marker \
row in one transaction from exported SQLAlchemy metadata. The marker is exactly \
`dr-store-postgresql-v1`, and its persisted literal is pinned by a golden \
contract test. A repeated installation fails visibly rather than adopting or \
verifying existing objects. Direct `PostgresBackend(...)` construction is \
unsupported; `PostgresBackend.open_sync(engine)` or \
`await PostgresBackend.open(engine)` returns only after reading and exactly \
validating the marker. A missing, malformed, or unsupported marker fails before \
the backend can perform ordinary storage work. Opening and ordinary operations \
never create, alter, adopt, or upgrade storage. The namespace is not \
configurable, dr-store ships no migration chain of its own, and the storage \
contract defines no schema inspection framework, compatibility negotiation, \
migration, or upgrade path."""
rationale = """
Explicit installation keeps deployment privileges and failure recovery outside \
arbitrary application startup. One absent-only namespace gives installation a \
deterministic ownership boundary, while one exact persisted marker prevents an \
incompatible schema from being used silently. Exported metadata lets platform \
Alembic own migration orchestration without dr-store carrying a second chain."""
date = "2026-08-08"
check = "scripts/test-postgres.sh"

[[contracts]]
title = "PostgreSQL uses one caller-owned engine and sync enlisted connections"
statement = """
`sqlalchemy[asyncio]` and `psycopg` are required runtime dependencies. \
`PostgresBackend` accepts a caller-owned SQLAlchemy `Engine` through \
`open_sync` or an `AsyncEngine` through its awaited `open` operation as its \
connection source. Backends opened with `open_sync` support sync enlisted \
methods and raise on awaited auto-acquire operations; backends opened with \
`open` support both paths. Sync enlisted methods accept one explicit \
SQLAlchemy Core ``Connection``; when provided, the operation runs on it and \
never commits, rolls back, or releases it. Enlisted \
``get_bound_objects_enlisted`` fetches bindings and referenced objects on that \
connection and observes one caller-transaction snapshot, including uncommitted \
writes in that transaction. Auto-acquire operations acquire a connection, use \
one transaction for non-empty writes, and release the connection before the \
operation completes. The backend never closes or disposes the caller-owned \
engine. It defines no custom connection-source Protocol, DSN acceptance or \
ownership, second managed-source lifecycle API, ambient transaction context, \
ORM Session surface, savepoint API, or distributed-transaction machinery."""
rationale = """
One engine boundary matches platform ownership while a narrow per-call enlisted \
connection supports ledger-coordinated evidence reads and writes without \
inventing a general adapter framework or a second managed lifecycle."""
date = "2026-08-11"
check = "scripts/test-postgres.sh"

[[contracts]]
title = "PostgreSQL preserves exact text identity"
statement = """
On supported UTF-8 PostgreSQL 16 through 18 databases, PostgreSQL stores opaque \
schemas and binding keys as text columns using `pg_catalog.ucs_basic`. Their \
equality and uniqueness never inherit the database default collation and \
preserve exact case-sensitive and non-ASCII string identity. Canonical JSON text \
is recovered without normalization and compared exactly by the backend contract. \
Hash columns separately accept only their declared full lowercase hexadecimal \
representation."""
rationale = """
Storage identity must have the same meaning in every deployment. Pinning text \
comparison prevents locale or database configuration from changing binding \
winners while retaining natural string values and diagnostics."""
date = "2026-08-08"
check = "scripts/test-postgres.sh"

[[contracts]]
title = "PostgreSQL object lookup and batches scale by bounded chunks"
statement = """
The PostgreSQL objects table uses `PRIMARY KEY (content_hash, schema)`, or an \
equivalent key plus an index whose leading column is `content_hash`. Point \
methods may use point statements. Batch methods deduplicate identical object \
references before sending canonical object data, chunk requests by explicit \
driver and statement bounds, fetch bindings in set-based statements, fetch \
distinct referenced objects separately in set-based statements, and reconstruct \
binding results in Python. Database round trips grow with bounded chunks rather \
than entries, one canonical record is not transferred once per referring key, \
and each non-empty write batch uses one transaction."""
rationale = """
The semantic batch boundary must remain useful over a network database. \
Hash-leading lookup avoids scans for alternate-schema resolution, while \
set-based binding and distinct-object fetches prevent N-plus-one round trips and \
payload multiplication when many keys refer to one object."""
date = "2026-08-08"
check = "scripts/test-postgres.sh"

[[contracts]]
title = "PostgreSQL credentials remain at the connection boundary"
statement = """
The PostgreSQL API accepts only the caller-owned engine and never accepts, \
stringifies, or retains a DSN or other credential-bearing connection value. It \
does not include one in representations, messages, logs, storage identities, or \
metadata that dr-store constructs. Driver exceptions remain available as causes \
rather than being recursively rewritten, and the connection path is exercised \
against password-authenticated PostgreSQL."""
rationale = """
Shared deployments require secrets that local trust authentication can hide \
from tests. Constraining dr-store-owned output prevents accidental disclosure \
without adding a fragile sanitizer for arbitrary third-party exception text."""
date = "2026-08-08"
check = "scripts/test-postgres.sh"

[[contracts]]
title = "Object reference wire strings use a pinned prefix"
statement = """
An object reference may be formatted as one opaque wire string whose prefix is \
exactly ``dr-store-object:v1`` followed by the validated schema and \
64-character lowercase content hash separated by colons. \
``format_object_reference`` and ``parse_object_reference`` round-trip that \
shape and reject malformed input before storage work begins."""
rationale = """
Platform references remain opaque strings at the ledger boundary while dr-store \
owns the object identity encoding that becomes an evidence or output reference."""
date = "2026-08-12"
check = "uv run pytest -q tests/content_addressing/test_content_addressing.py"

[[contracts]]
title = "Enlisted PostgreSQL batch writes leave executed object inserts in the caller transaction on conflict"
statement = """
When ``put_bound_objects_enlisted`` runs on a caller-supplied enlisted \
connection and raises ``ObjectConflictError`` after inserting one or more \
object rows, those object inserts remain visible on that same open connection \
until the caller commits or rolls back. Binding inserts that follow the failed \
conflict check are not performed. Above that backend operation, \
``ObjectStore.put_many_enlisted`` is first-writer-wins per key: a key already \
bound keeps its existing binding, and the reference returned for that key is \
the existing winner rather than the rejected reference just offered. The \
losing record is still stored content-addressed; only the binding refuses to \
move. The whole batch is visible or absent with the caller's transaction."""
rationale = """
Platform ledger enlistment may compose several storage steps in one caller \
transaction. Conflict after partial progress must not erase already-executed \
object inserts from the enlisted snapshot the caller is coordinating. \
Returning the existing winner rather than the offered reference is what lets a \
caller detect that its own write lost and reconcile, so it is pinned against a \
real database rather than inferred from a fake."""
date = "2026-08-12"
check = "scripts/test-postgres.sh tests/object_store/test_enlisted.py"
