[[contracts]]
title = "Object reference wire strings use a pinned prefix"
statement = """
An object reference may be formatted as one opaque wire string whose prefix is \
exactly ``dr-store-object:v1`` followed by the validated schema and \
64-character lowercase content hash separated by colons. \
``format_object_reference`` and ``parse_object_reference`` round-trip that \
shape and reject malformed input before storage work begins."""
rationale = """
Platform references remain opaque strings at the ledger boundary while dr-store \
owns the object identity encoding that becomes an evidence or output reference."""
date = "2026-08-12"
check = "uv run pytest -q tests/content_addressing/test_content_addressing.py"

[[contracts]]
title = "Enlisted PostgreSQL batch writes leave executed object inserts in the caller transaction on conflict"
statement = """
When ``put_bound_objects_enlisted`` runs on a caller-supplied enlisted \
connection and raises ``ObjectConflictError`` after inserting one or more \
object rows, those object inserts remain visible on that same open connection \
until the caller commits or rolls back. Binding inserts that follow the failed \
conflict check are not performed."""
rationale = """
Platform ledger enlistment may compose several storage steps in one caller \
transaction. Conflict after partial progress must not erase already-executed \
object inserts from the enlisted snapshot the caller is coordinating."""
date = "2026-08-12"
check = "scripts/test-postgres.sh"
