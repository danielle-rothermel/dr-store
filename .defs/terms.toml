#:schema ./terms.schema.json

[[terms]]
name = "record"
definition = """
A complete strict JSON value that carries everything the caller means to \
persist as one content-addressed value."""
categories = ["content addressing", "object storage"]

[[terms]]
name = "schema"
definition = """
A non-empty caller-declared text label for the shape and meaning of a record. \
It contains neither NUL nor unpaired surrogate code points, is otherwise opaque \
to storage, and distinguishes references to the same content under different \
declared shapes."""
categories = ["content addressing", "object storage"]
part_of = ["object reference"]

[[terms]]
name = "canonical JSON text"
definition = """
The single deterministic UTF-8 JSON text selected for an accepted value by a \
declared canonical profile. Equivalent accepted values have the same text \
regardless of incidental formatting or object-key order."""
categories = ["content addressing", "object storage", "document artifacts"]

[[terms]]
name = "unbudgeted"
definition = """
An explicit declaration that the executor installs no policy limit for an \
axis. It is neither an unlimited-resource promise nor a bounded-return \
guarantee."""

[[terms]]
name = "hash"
definition = """
A deterministic fixed-length value computed by a declared algorithm over \
exact declared input bytes; its qualified name supplies its role and input \
semantics."""
categories = ["content addressing", "document artifacts"]

[[terms]]
name = "key"
definition = """
An opaque caller-owned text string naming one place in a binding table. It may \
be empty but contains neither NUL nor unpaired surrogate code points; storage \
does not otherwise parse it or assign it domain meaning."""
categories = ["object storage"]
part_of = ["binding"]

[[terms]]
name = "binding"
definition = """
A single-assignment association from a key to one object reference. While it \
exists it is neither replaced nor rebound; cache-grade binding eviction is the \
only operation that removes it, and a key evicted that way is bindable again \
from its unbound state."""
categories = ["object storage"]
part_of = ["object store"]

[[terms]]
name = "idempotent replay"
definition = """
A repeated write of the value already stored at the same place. It succeeds \
without creating or changing stored content."""
categories = ["object storage"]

[[terms]]
name = "conflict"
definition = """
An attempted write of a different value at an occupied single-assignment \
place. The attempt reports a typed conflict outcome and leaves the existing \
value unchanged."""
categories = ["object storage"]

[[terms]]
name = "append-only"
definition = """
The property that object rows and their content associations are added but \
never mutated or removed through the storage contract. The key-to-reference \
mapping is single-assignment rather than append-only: cache-grade binding \
eviction is its one removal path, and no operation mutates an existing \
association in place."""
categories = ["object storage"]

[[terms]]
name = "compare-and-set"
definition = """
An atomic operation that stores a value only when its place is empty and \
otherwise preserves and reports the existing value."""
categories = ["object storage"]

[[terms]]
name = "content hash"
definition = """
The full 64-character lowercase SHA-256 hash of a complete record's canonical \
JSON bytes. It addresses the complete stored value rather than a \
caller-selected identity subset."""
exported_symbols = [
  "compute_content_hash",
  "is_content_hash",
  "CONTENT_HASH_LENGTH",
]
categories = ["content addressing", "object storage"]
is_a = ["hash"]
part_of = ["object reference"]

[[terms]]
name = "object reference"
definition = """
A validated content-addressed handle composed of a schema from the shared text \
domain and the full content hash of one record."""
exported_symbols = [
  "ObjectReference",
  "ReferenceValidationError",
  "OBJECT_REFERENCE_PREFIX",
  "format_object_reference",
  "parse_object_reference",
]
categories = ["content addressing", "object storage"]
part_of = ["binding"]

[[terms]]
name = "object store"
definition = """
The asynchronous append-only mapping from object references to immutable records \
together with the single-assignment mapping from caller-owned keys to those \
references, whose entries are removable only by cache-grade binding eviction."""
exported_symbols = ["ObjectStore", "StoreError", "StoreHit"]
categories = ["object storage"]

[[terms]]
name = "immutable put"
definition = """
The operation that derives a record's object reference and establishes its \
stored association once. An identical replay succeeds, while different \
content at the same reference conflicts without replacement."""
exported_symbols = ["PutStatus", "ObjectConflictError"]
categories = ["object storage"]

[[terms]]
name = "verified get"
definition = """
The resolution of an object reference to a record only after the stored \
schema, canonical representation, and content hash have been checked against \
that reference."""
exported_symbols = [
  "ObjectNotFoundError",
  "SchemaMismatchError",
  "ContentHashMismatchError",
  "ContentMismatchReason",
]
categories = ["object storage"]

[[terms]]
name = "atomic key-to-reference binding"
definition = """
The compare-and-set operation that establishes a binding for an unbound key, \
treats the same reference as an idempotent replay, and preserves the existing \
reference on conflict."""
exported_symbols = ["BindStatus", "BindingConflictError"]
categories = ["object storage"]
is_a = ["compare-and-set"]

[[terms]]
name = "binding eviction"
definition = """
The cache-grade awaited operation that deletes the binding rows for \
caller-supplied exact keys. It removes resolvability and never content, so \
referenced objects stay stored and retrievable by reference. Evicting an \
unbound key is a reported absence rather than a failure, and no enlisted \
variant exists."""
exported_symbols = ["EvictStatus"]
categories = ["object storage"]
part_of = ["object store"]

[[terms]]
name = "backend"
definition = """
The asynchronous storage boundary that supplies atomic insert-if-absent \
operations, point and batch operations for object and binding tables, and an \
exact-key binding delete. Each implementation owns its persistence scope and \
completes transaction and resource cleanup before an awaited operation \
terminates."""
exported_symbols = [
  "Backend",
  "MemoryBackend",
  "SqliteBackend",
  "PutOutcome",
  "BindOutcome",
]
categories = ["object storage"]

[[terms]]
name = "PostgreSQL backend"
definition = """
A persistent shared storage capability whose fixed `dr_store` schema and exact \
schema-format marker are installed explicitly in a caller-selected PostgreSQL \
database through one caller-owned SQLAlchemy engine. Table definitions are \
exported as SQLAlchemy metadata for platform Alembic ownership. \
``PostgresBackend.open_sync`` validates the marker on a sync ``Engine`` for \
checkpoint-first assembly; ``await PostgresBackend.open`` validates it on an \
``AsyncEngine`` for awaited auto-acquire operations. Auto-acquire operations \
use the awaited backend protocol. Sync enlisted methods accept an explicit \
SQLAlchemy Core ``Connection`` so evidence writes can join a caller-owned \
checkpoint transaction; ``ObjectStore`` sync enlisted helpers require \
``PostgresBackend`` as the checkpoint integration surface and include verified \
read helpers on a caller-owned connection. Enlisted \
``get_bound_objects_enlisted`` observes one caller-transaction snapshot. \
Opening validates the marker before independently running clients observe the \
same backend semantics, without PostgreSQL-specific behavior entering the \
record cache surface."""
exported_symbols = [
  "PostgresBackend",
  "POSTGRES_METADATA",
  "POSTGRES_SCHEMA_FORMAT",
  "install_postgres",
  "install_postgres_sync",
]
categories = ["object storage"]
is_a = ["backend"]

[[terms]]
name = "bound object batch"
definition = """
An awaited backend operation over caller-supplied exact keys that either reads \
each available binding together with its referenced object row or atomically stores \
prepared objects and establishes their first-writer bindings."""
exported_symbols = ["BoundObjectRow", "BoundObjectWrite"]
categories = ["object storage", "record caching"]
part_of = ["backend"]

[[terms]]
name = "canonical JSON document file"
definition = """
A standalone caller-named document whose complete value is stored and recovered \
as canonical JSON within caller-declared resource bounds."""
exported_symbols = ["CanonicalJsonFile", "DocumentFileError"]
categories = ["document artifacts"]

[[terms]]
name = "document publication failure"
definition = """
A failed canonical-document publication that identifies the publication phase \
and whether replacement is known not to have occurred, known to have occurred, \
or cannot be determined from the failed operation."""
exported_symbols = [
  "DocumentPublishError",
  "PublicationStage",
  "ReplacementState",
]
categories = ["document artifacts"]

[[terms]]
name = "document read failure"
definition = """
A failed attempt to recover one complete canonical document within its declared \
bounds from the document selected at the start of the read. It reports the read \
phase and whether the failure is missing, not regular, mismatched, or \
bounds-exceeded."""
exported_symbols = ["DocumentReadError", "ReadStage"]
categories = ["document artifacts"]

[[terms]]
name = "document directory"
definition = """
One mutable work-in-progress document artifact grouping one canonical JSON \
manifest with zero or more sidecars. The caller owns their meaning, publication \
coordination, completion policy, and retention."""
exported_symbols = [
  "DocumentDirectory",
  "AllocationError",
  "DocumentDirectoryError",
]
categories = ["document artifacts"]

[[terms]]
name = "manifest"
definition = """
A canonical JSON document file whose caller-owned payload defines the meaning \
and completeness of the sidecars in its document directory."""
exported_symbols = ["ManifestPublishError", "ManifestReadError"]
categories = ["document artifacts"]
is_a = ["canonical JSON document file"]
part_of = ["document directory"]

[[terms]]
name = "sidecar"
definition = """
A raw-bytes artifact written incrementally beside a manifest, optionally \
retaining bounded head and tail segments. It is not self-describing; its \
meaning and completeness come from caller-owned metadata."""
exported_symbols = ["SidecarWriter", "SidecarSummary"]
categories = ["document artifacts"]
part_of = ["document directory"]

[[terms]]
name = "sidecar hash"
definition = """
The full 64-character lowercase SHA-256 hash of a sidecar's stored bytes after \
any truncation. Its input is raw bytes, so it is not a content hash."""
exported_symbols = ["SidecarVerificationError"]
categories = ["document artifacts"]
is_a = ["hash"]

[[terms]]
name = "verified regular-child read"
definition = """
A bounded operation that opens one regular direct child through pinned \
no-follow descriptors, verifies the caller-supplied byte length and SHA-256 \
digest against the recovered bytes, and returns those verified bytes."""
exported_symbols = [
  "read_verified_regular_child",
  "RegularChildFailureReason",
  "VerifiedRegularChildReadError",
]
categories = ["document artifacts"]

[[terms]]
name = "record cache"
definition = """
The asynchronous memoization facade that binds cache keys to object references \
over an object store and returns a typed hit or miss for each exact requested \
key. It adds no delete, expiry, eviction, size-cap, enumeration, prefix-query, \
dirty-tracking, or scheduling path."""
exported_symbols = ["RecordCache", "RecordCacheStats", "CacheHit"]
categories = ["record caching"]

[[terms]]
name = "managed SQLite record cache"
definition = """
A long-lived asynchronous persistent record cache that owns the current-process \
SQLite backend, dedicated worker, connection, and resource lifecycle for one \
cache instance."""
exported_symbols = [
  "SqliteRecordCache",
  "SqliteRecordCacheCloseError",
  "SqliteRecordCacheClosedError",
]
categories = ["record caching"]
is_a = ["record cache"]

[[terms]]
name = "cache key"
definition = """
An opaque caller-owned string naming one record cache entry. A caller may \
derive it from a versioned namespace and payload through the canonical JSON \
profile or supply another key scheme; invalidation selects a new key rather \
than replacing an entry."""
exported_symbols = ["derive_cache_key"]
categories = ["record caching"]
is_a = ["key"]
part_of = ["record cache"]

[[terms]]
name = "artifact bundle"
definition = """
A terminal completed publication composed of one bundle manifest and exactly \
the zero or more bundle artifacts described by it. It is a packaging layer over \
one document directory: the manifest is that directory's Manifest and the \
artifacts are its regular direct children. The supported API exposes no \
mutation after completion; a directory left before final manifest publication \
is incomplete rather than an artifact bundle."""
exported_symbols = ["ArtifactBundleError", "BundleAllocationError"]
categories = ["document artifacts"]

[[terms]]
name = "bundle artifact"
definition = """
One complete raw-byte regular file included as a direct child of an artifact \
bundle and identified by a safe exact relative name. Its domain meaning belongs \
to the caller's manifest payload."""
exported_symbols = ["BundleArtifactWriter"]
categories = ["document artifacts"]
part_of = ["artifact bundle"]

[[terms]]
name = "artifact hash"
definition = """
The full 64-character lowercase SHA-256 hash of one bundle artifact's complete \
stored bytes. Its input is raw bytes, so it is not a content hash."""
categories = ["document artifacts"]
is_a = ["hash"]
part_of = ["artifact descriptor"]

[[terms]]
name = "artifact descriptor"
definition = """
A storage-owned manifest entry containing one bundle artifact's exact relative \
name, artifact hash, and byte length. It describes integrity and extent, not \
the artifact's domain-specific meaning."""
exported_symbols = ["ArtifactDescriptor"]
categories = ["document artifacts"]
part_of = ["bundle manifest"]

[[terms]]
name = "bundle manifest"
definition = """
A canonical JSON value stored as the final artifact-bundle child. It enumerates \
the bundle's exact artifact descriptors and carries an opaque strict JSON \
payload whose domain schema belongs to the caller."""
exported_symbols = ["BundleManifest"]
categories = ["document artifacts"]
part_of = ["artifact bundle"]

[[terms]]
name = "artifact bundle publication"
definition = """
The storage-owned operation that allocates a fresh document directory, admits \
independent writers for distinct artifact names, and begins terminal \
bundle-manifest publication only with a valid payload after every admitted \
writer has finalized successfully. The terminal attempt is one document \
directory Manifest publication. Once it begins, the operation exposes no \
supported mutation, retry, or republishing path."""
exported_symbols = ["ArtifactBundlePublication"]
categories = ["document artifacts"]

[[terms]]
name = "artifact bundle read"
definition = """
A bounded operation that validates one completed bundle manifest as a document \
directory Manifest before either auditing every declared bundle artifact or \
verified-consuming one selected artifact. Every artifact recovery is one \
verified regular-child read."""
exported_symbols = [
  "ArtifactBundleReader",
  "BundleReadLimits",
  "BundleReadError",
  "BundleIncompleteError",
]
categories = ["document artifacts"]

[[terms]]
name = "artifact bundle integrity audit"
definition = """
An artifact bundle read that eagerly verifies the complete bytes of every \
declared bundle artifact. Its successful result describes the bytes verified at \
audit time without claiming protection from later external filesystem \
mutation."""
categories = ["document artifacts"]
is_a = ["artifact bundle read"]

[[terms]]
name = "verified artifact consumption"
definition = """
An artifact bundle read that recovers one selected bundle artifact by one \
bounded verified regular-child read and then delivers those verified bytes to a \
synchronous consumer while recomputing their artifact hash and byte length. It \
succeeds only after the consumer reaches end of file and both values match the \
artifact descriptor."""
exported_symbols = ["VerifyingArtifactReader"]
categories = ["document artifacts"]
is_a = ["artifact bundle read"]

[[terms]]
name = "artifact bundle publication failure"
definition = """
A typed refusal or failure to publish the terminal manifest for one artifact \
bundle publication. It preserves the publication phase, available replacement \
knowledge, and underlying cause needed to distinguish an unmet writer \
precondition, a known incomplete location, and an uncertain terminal manifest \
outcome."""
exported_symbols = ["BundlePublishError", "BundlePublicationPhase"]
categories = ["document artifacts"]

[[terms]]
name = "artifact bundle verification failure"
definition = """
A typed artifact bundle read failure identifying one selected or declared \
artifact and the reason its recovered or consumed bytes did not complete \
verified agreement with the bundle manifest."""
exported_symbols = [
  "BundleVerificationError",
  "BundleVerificationReason",
]
categories = ["document artifacts"]

[[terms]]
name = "cache entry"
definition = """
One caller-proposed schema-qualified record associated with an exact cache key \
for a single or batch cache put."""
exported_symbols = ["CacheEntry"]
categories = ["record caching"]
part_of = ["record cache"]

[[terms]]
name = "record cache read"
definition = """
An awaited read that reports one hit or miss for every distinct exact requested \
key. An absent, missing, wrong-schema, or unverifiable stored value is a miss; \
invalid requested schemas, cancellation, and operational backend faults remain \
visible."""
categories = ["record caching"]
part_of = ["record cache"]

[[terms]]
name = "lease"
definition = """
A time-bounded exclusive hold on one semantic key that authorizes one owner and \
one attempt identity to publish exactly one terminal outcome before expiry."""
categories = ["lease authority"]

[[terms]]
name = "terminal"
definition = """
The immutable published outcome for one leased semantic key: succeeded with a \
result reference, failed with a result reference and structured failure, or \
recovery-required with a structured failure when redrive is forbidden."""
categories = ["lease authority"]

[[terms]]
name = "fence"
definition = """
A monotonic positive signed 64-bit integer associated with one lease generation. \
Takeover after expiry increments the fence; terminal publication pins the fence \
of the authoritative lease."""
categories = ["lease authority"]

[[terms]]
name = "replay policy"
definition = """
The caller-declared rule for how an expired or replayed lease may be redriven: \
idempotent replay, durable workflow redrive, or no redrive."""
categories = ["lease authority"]

[[terms]]
name = "semantic key"
definition = """
A non-empty opaque text key naming one leased coordination slot. It contains no \
NUL bytes and is bounded in length; storage does not parse its domain meaning."""
categories = ["lease authority"]

[[terms]]
name = "owner identity"
definition = """
A non-empty bounded text label naming the worker or process that holds a lease. \
Together with attempt identity it distinguishes concurrent holders of the same \
semantic key."""
categories = ["lease authority"]

[[terms]]
name = "attempt identity"
definition = """
A non-empty bounded text label naming one execution try within an owner. \
Re-acquire with the same owner and attempt returns the existing unexpired lease."""
categories = ["lease authority"]
